<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="14" fill="url(#bgGrad)"/>

  <!-- Left: 3 slices parts -->
  <g transform="translate(60, 30)">
    <!-- Top slice -->
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#3b82f6" fill-opacity="0.8" stroke="#60a5fa" stroke-width="2"/>
    <text x="110" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. 上部ヘッダー (Top)</text>

    <!-- Loop slice -->
    <rect x="0" y="70" width="220" height="80" rx="8" fill="#10b981" fill-opacity="0.8" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="105" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. 中間ループ (Loop)</text>
    <text x="110" y="125" fill="#d1fae5" font-family="sans-serif" font-size="11" text-anchor="middle">※行数に応じて自動リピート</text>

    <!-- Bottom slice -->
    <rect x="0" y="160" width="220" height="60" rx="8" fill="#f59e0b" fill-opacity="0.8" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="196" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. 下部フッター (Bottom)</text>
  </g>

  <!-- Arrow -->
  <path d="M 330 140 L 430 140" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <polygon points="435,140 425,134 425,146" fill="#94a3b8"/>
  <text x="382" y="125" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">自動結合 &amp; 描画</text>

  <!-- Right: Combined Result -->
  <g transform="translate(480, 20)">
    <rect x="0" y="0" width="240" height="250" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Top area -->
    <rect x="2" y="2" width="236" height="50" rx="8" fill="#3b82f6" fill-opacity="0.4"/>
    <text x="120" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">【公演名など】</text>

    <!-- Loop items area -->
    <rect x="2" y="55" width="236" height="135" fill="#10b981" fill-opacity="0.2"/>
    <text x="20" y="80" fill="#f8fafc" font-family="sans-serif" font-size="12">１ステ ...様 5枚</text>
    <text x="20" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12">１ステ ...様 8枚</text>
    <text x="20" y="130" fill="#f8fafc" font-family="sans-serif" font-size="12">３ステ ...様 12枚</text>
    <text x="20" y="155" fill="#f8fafc" font-family="sans-serif" font-size="12">配信 ...様 6枚</text>
    <text x="20" y="178" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="bold"></text>

    <!-- Bottom area -->
    <rect x="2" y="193" width="236" height="55" rx="8" fill="#f59e0b" fill-opacity="0.4"/>
    <text x="120" y="225" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">合計: 31枚</text>
  </g>
</svg>
